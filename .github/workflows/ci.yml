name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-6vcpu-macos-15, blacksmith-4vcpu-windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        if: runner.os != 'macOS'
      - name: Run npm test
        if: runner.os == 'macOS'
        shell: bash
        run: |
          trap 'printf "CI npm test shell received SIGTERM: shell=%s parent=%s\n" "$$" "$PPID"; ps -o pid,ppid,pgid,stat,command -p "$$" -p "$PPID" || true' TERM
          set +e
          npm test
          result=$?
          if [[ "$result" -ne 0 ]]; then
            printf 'CI npm test exited: status=%s shell=%s parent=%s\n' "$result" "$$" "$PPID"
            ps -o pid,ppid,pgid,stat,command -p "$$" -p "$PPID" || true
          fi
          exit "$result"
      - run: npm run build
      - run: npm run test:sites
