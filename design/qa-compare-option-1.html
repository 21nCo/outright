<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outright option 1 comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; color: #ececea; background: #0b0b0b; font: 14px/1.4 system-ui, sans-serif; }
      header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 18px; }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 3px 0 0; color: #999; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 8px; color: #bbb; font-weight: 650; }
      img { display: block; width: 100%; aspect-ratio: 1.40625; object-fit: cover; object-position: top; border: 1px solid #343434; border-radius: 8px; background: #161616; }
      .note { color: #7dddac; }
    </style>
  </head>
  <body>
    <header><div><h1>Outright — option 1 alignment</h1><p>Expanded project tree, single conversation workspace, dense IDE rhythm.</p></div><span class="note">Final implementation</span></header>
    <main>
      <figure><figcaption>Selected reference: option 1</figcaption><img src="/design/reference-option-1.png" alt="Selected option 1 reference" /></figure>
      <figure><figcaption>Implementation at 1440 × 1024</figcaption><img src="/design/implementation-option-1-1440x1024@2x.png" alt="Implemented Outright interface" /></figure>
    </main>
  </body>
</html>
